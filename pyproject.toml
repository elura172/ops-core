[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-core"
version = "0.1.0"
description = "Dry-run-first commerce operations core: TikTok Shop and Amazon private label"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "fpdf2>=2.8.9",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.6",
    "python-multipart>=0.0.32",
    "shippo>=3.9.0",
    "stripe>=16.0.0",
]

[tool.setuptools]
# Explicit discovery so `tests` is never packaged. Note this does NOT catch a
# build that cannot see `app/` -- that still installs an empty package silently;
# the import check in the Dockerfile is what actually catches it.
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
"app.web" = ["*.html", "*.css", "*.js"]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]
# httpx2 is what current starlette wants for TestClient; with only httpx it
# warns today and newer starlette refuses outright.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "httpx2>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary,pool]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves these per request; they are not shared mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
