[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-ops"
version = "0.1.0"
description = "Dry-run-first TikTok Shop operations core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[tool.setuptools]
# Explicit discovery so `tests` is never packaged. Note this does NOT catch a
# build that cannot see `app/` -- that still installs an empty package silently;
# the import check in the Dockerfile is what actually catches it.
packages = { find = { include = ["app*"] } }

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves these per request; they are not shared mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
