services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tiktok_ops
      POSTGRES_USER: tiktok_ops
      POSTGRES_PASSWORD: change-me-in-staging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiktok_ops -d tiktok_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DRY_RUN: "true"
      ORDER_DB: /tmp/orders.db
      TTS_WEBHOOK_SECRET: ${TTS_WEBHOOK_SECRET:-staging-only}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
